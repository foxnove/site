<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Radar Europa 2027</title><style>body{background:#101827;color:white;font:16px system-ui;margin:0}main{max-width:900px;margin:auto;padding:30px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card{background:#22314a;padding:20px;border-radius:16px}.price{font-size:30px;color:#91f4bf}</style><main><h1>✈ Radar Europa 2027</h1><p>Saindo de Salvador · Fevereiro/março e julho/agosto · Preços por pessoa, ida e volta</p><p id="status">Aguardando dados reais.</p><div class="grid" id="offers"></div></main><script>fetch('data.json?'+Date.now()).then(r=>r.json()).then(d=>{document.querySelector('#status').textContent=d.updated_at?'Atualizado: '+d.updated_at:'Aguardando primeira consulta';document.querySelector('#offers').innerHTML=(d.offers||[]).map(o=>'<div class="card"><b>'+o.destination+'</b><p class="price">R$ '+o.price.toLocaleString('pt-BR')+'</p><p>'+o.departure+' → '+o.return+'</p></div>').join('')}).catch(()=>{})</script></html>
