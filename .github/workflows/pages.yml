name: Publicar site e Radar Europa 2027 no GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - index.html
      - 'radar-europa-2027/**'
      - '.github/workflows/pages.yml'
      - '.github/workflows/publicar-radar-europa.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publicar:
    uses: ./.github/workflows/publicar-radar-europa.yml
