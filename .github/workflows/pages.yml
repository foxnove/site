name: Publicar site e Radar Europa 2027 no GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar site publico
        uses: actions/checkout@v4
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Empacotar site sem alterar outros projetos
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
