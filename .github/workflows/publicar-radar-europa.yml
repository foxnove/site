name: Publicar Radar Europa 2027 no GitHub Pages
on:
  push:
    branches: [radar-europa-2027]
    paths:
      - 'radar-europa-2027/docs/**'
      - '.github/workflows/publicar-radar-europa.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-radar-europa
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: radar-europa-2027/docs
      - id: deployment
        uses: actions/deploy-pages@v4
