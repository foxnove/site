name: Radar Europa 2027 - publicar site
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-site
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Prepare public site assets
        run: |
          mkdir -p _site/radar-europa-2027
          cp index.html _site/index.html
          for asset in index.html app.js styles.css data.json; do
            cp "radar-europa-2027/$asset" "_site/radar-europa-2027/$asset"
          done
          touch _site/.nojekyll
          python -m json.tool _site/radar-europa-2027/data.json > /dev/null
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
