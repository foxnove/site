# Legacy private Pages deployment is superseded by foxnove/youtube Pages.
name: Radar Europa 2027 - publicação privada desativada
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-radar-europa
  cancel-in-progress: true
jobs:
  deploy:
    if: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: radar-europa-2027/docs
      - id: deployment
        uses: actions/deploy-pages@v4
