name: Radar Europa 2027
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: radar-europa-2027-monitor
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: radar-europa-2027
          path: backend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'requests>=2.32.3,<3'
      - name: Test monitor
        run: python -m unittest discover -s backend/radar-europa-2027 -p 'test_*.py'
      - name: Query production fares
        id: scan
        continue-on-error: true
        run: python backend/radar-europa-2027/serpapi_scan.py
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          RADAR_SCHEDULE_ENABLED: 'true'
      - name: Persist private state and public snapshot
        if: always()
        working-directory: backend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar-europa-2027/docs/data.json
          if [ -d radar-europa-2027/private ]; then git add radar-europa-2027/private; fi
          git diff --cached --quiet || (git commit -m "Atualizar preços Radar Europa" && git push)
      - name: Checkout public site master
        uses: actions/checkout@v4
        with:
          repository: foxnove/site
          ref: master
          path: public
          token: ${{ github.token }}
          sparse-checkout: radar-europa-2027
      - name: Synchronize allowlisted public data
        run: python backend/radar-europa-2027/sync_public.py --checkout public
      - name: Report unavailable API
        if: steps.scan.outcome == 'failure'
        run: |
          echo 'No successful production scan. See public status; credentials or API access may be missing.'
          exit 1
